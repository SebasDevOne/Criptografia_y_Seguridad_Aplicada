spring.application.name=SecureLink
server.port=8080

# SQLite: un archivo local. foreign_keys=on activa las llaves foraneas (SQLite las ignora por defecto).
spring.datasource.url=jdbc:sqlite:${SECURELINK_DB:securelink.db}?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor: un pool de una conexion evita errores SQLITE_BUSY.
spring.datasource.hikari.maximum-pool-size=1

# El esquema (3FN) y los datos del laboratorio viven en archivos SQL, no en el codigo.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# Cookie de sesion: HttpOnly, SameSite y sin ;jsessionid en la URL.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Costo de bcrypt para las contrasenas de los usuarios.
securelink.seguridad.bcrypt-costo=10

# Usuarios iniciales (se guardan SOLO como hash bcrypt). Se pueden cambiar con variables de
# entorno SECURELINK_ADMIN_PASS, SECURELINK_USUARIO_PASS y SECURELINK_INVITADO_PASS.
securelink.semilla.usuarios[0].nombre=admin
securelink.semilla.usuarios[0].contrasena=${SECURELINK_ADMIN_PASS:Admin123*}
securelink.semilla.usuarios[0].rol=admin
securelink.semilla.usuarios[1].nombre=usuario
securelink.semilla.usuarios[1].contrasena=${SECURELINK_USUARIO_PASS:Usuario123*}
securelink.semilla.usuarios[1].rol=usuario
securelink.semilla.usuarios[2].nombre=invitado
securelink.semilla.usuarios[2].contrasena=${SECURELINK_INVITADO_PASS:Invitado123*}
securelink.semilla.usuarios[2].rol=invitado
